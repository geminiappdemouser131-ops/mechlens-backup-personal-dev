# release config - transformer-lens
cadence: last-thursday-of-month
in_window_releases:
  - { version: "2.11.0", date: "2026-01-29" }
  - { version: "2.12.0", date: "2026-02-26" }
  - { version: "2.13.0", date: "2026-03-26" }
  - { version: "2.14.0", date: "2026-04-30" }
  - { version: "2.15.0", date: "2026-05-28" }
  - { version: "2.16.0", date: "2026-06-25" }
  - { version: "2.16.1", date: "2026-06-27", kind: hotfix }
next: { version: "2.17.0", date: "2026-07-30" }

gates:
  demo_notebook_sweep: green   # run Wednesday evening before the cut; any failure blocks
  ci: green                    # Yusuke confirms in the maintainer thread
  security_advisory_line: at-tag-only   # embargo holds until the tag

publish:
  index: pypi
  package: transformer-lens
  via: github-actions
  monitor_hours_after: 48
credit_contributors_by_handle: true
client_attribution: never
